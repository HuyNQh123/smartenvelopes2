<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout('Lời mời của bạn', 'invitations', ~{::#main-content}, ~{}, ~{})}">
    <body>
        <div id="main-content" class="member-page">
            <div class="page-header">
                <div>
                    <h1>
                        Lời mời của bạn
                    </h1>
                    <p class="page-description">
                        Xem quỹ được mời tham gia và chọn phản hồi phù hợp.
                    </p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/workspaces}" class="btn btn-outline-secondary">
                        Quỹ của bạn
                    </a>
                </div>
            </div>
            <section class="member-section empty-state" th:if="${#lists.isEmpty(invitations)}">
                <h2>
                    Không có lời mời đang chờ
                </h2>
                <p>
                    Lời mời gửi đến email tài khoản của bạn sẽ xuất hiện tại đây.
                </p>
                <a th:href="@{/workspaces}" class="btn btn-outline-secondary">
                    Xem quỹ của bạn
                </a>
            </section>
            <section class="member-section" th:unless="${#lists.isEmpty(invitations)}">
                <div th:replace="~{fragments/member-ui :: invitationList(${invitations})}">
                </div>
            </section>
        </div>
    </body>
</html>
