<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - SmartEnvelope</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-card {
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
        }
        .auth-header {
            background-color: #ffffff;
            padding: 2rem 2.5rem 1rem 2.5rem;
            text-align: center;
        }
        .auth-body {
            padding: 1.5rem 2.5rem 2.5rem 2.5rem;
            background-color: #ffffff;
        }
        .brand-icon {
            font-size: 2.8rem;
            color: #198754;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card auth-card">
                <div class="auth-header">
                    <div class="brand-icon">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Tạo Tài Khoản Mới</h3>
                    <p class="text-muted small">Bắt đầu hành trình tự do tài chính cùng SmartEnvelope</p>
                </div>
                <div class="auth-body">
                    <!-- Thông báo lỗi chung nếu có -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center py-2" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                        <div th:text="${errorMessage}">Đã xảy ra lỗi khi đăng ký.</div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Form Đăng ký -->
                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: Nguyễn Văn A" required autofocus>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                       placeholder="name@example.com" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Tên đăng nhập (Tùy chọn) -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tên đăng nhập <small class="text-muted fw-normal">(Tùy chọn, mặc định lấy theo email)</small></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-at"></i></span>
                                <input type="text" id="username" th:field="*{username}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                       placeholder="nguyenvana">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" th:field="*{password}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Tối thiểu 6 ký tự" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Xác nhận Mật khẩu -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                       placeholder="Nhập lại mật khẩu ở trên" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> Hoàn Tất Đăng Ký
                        </button>
                    </form>

                    <hr class="my-4 text-muted">

                    <div class="text-center">
                        <p class="text-muted mb-0">Đã có tài khoản? 
                            <a th:href="@{/login}" class="text-decoration-none fw-semibold text-primary">Đăng nhập ngay</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
