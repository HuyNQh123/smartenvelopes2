<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/resources :: head('Đăng ký')}">
    </head>
    <body class="auth-page">
        <main class="auth-container">
            <a class="auth-brand" th:href="@{/login}">
                <span class="brand-icon" aria-hidden="true">
                    <i class="bi bi-envelope-paper">
                    </i>
                </span>
                SmartEnvelope
            </a>
            <section class="auth-card" aria-labelledby="auth-title">
                <h1 id="auth-title">
                    Tạo tài khoản
                </h1>
                <p class="page-description mb-4">
                    Các trường có dấu * là bắt buộc.
                </p>
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                    Không thể tạo tài khoản. Vui lòng thử lại.
                </div>
                <form th:action="@{/register}" th:object="${registerRequest}" method="post" data-submit-feedback>
                    <div class="mb-3">
                        <label for="fullName" class="form-label">
                            Họ và tên
                            <span aria-hidden="true">
                                *
                            </span>
                        </label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control" autocomplete="name" required maxlength="100" autofocus
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('fullName')}" aria-describedby="fullName-error">
                        <div id="fullName-error" class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                            <span aria-hidden="true">
                                *
                            </span>
                        </label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" autocomplete="email" required maxlength="100"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('email')}" aria-describedby="email-error">
                        <div id="email-error" class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Tên đăng nhập
                            <span class="text-muted">
                                (tùy chọn)
                            </span>
                        </label>
                        <input type="text" id="username" th:field="*{username}" class="form-control" autocomplete="username" maxlength="50"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('username')}" aria-describedby="username-error username-help">
                        <div id="username-help" class="form-text">
                            Để trống để sử dụng email làm tên đăng nhập.
                        </div>
                        <div id="username-error" class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Mật khẩu
                            <span aria-hidden="true">
                                *
                            </span>
                        </label>
                        <div class="password-control">
                            <input type="password" id="password" th:field="*{password}" class="form-control" autocomplete="new-password" required maxlength="50" minlength="6"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('password')}" aria-describedby="password-error password-help">
                            <button type="button" class="btn btn-ghost password-toggle" data-password-toggle="password" aria-controls="password" aria-pressed="false" aria-label="Hiện mật khẩu">
                                <i class="bi bi-eye" aria-hidden="true">
                                </i>
                            </button>
                        </div>
                        <div id="password-help" class="form-text">
                            Mật khẩu từ 6 đến 50 ký tự.
                        </div>
                        <div id="password-error" class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Xác nhận mật khẩu
                            <span aria-hidden="true">
                                *
                            </span>
                        </label>
                        <div class="password-control">
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" required
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}" aria-describedby="confirmPassword-error">
                            <button type="button" class="btn btn-ghost password-toggle" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-pressed="false" aria-label="Hiện mật khẩu">
                                <i class="bi bi-eye" aria-hidden="true">
                                </i>
                            </button>
                        </div>
                        <div id="confirmPassword-error" class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" data-loading-button>
                        <span class="btn-label">
                            Đăng ký
                        </span>
                        <span class="spinner-border spinner-border-sm loading-spinner" aria-hidden="true">
                        </span>
                    </button>
                </form>
                <p class="auth-link">
                    Đã có tài khoản?
                    <a th:href="@{/login}">
                        Đăng nhập
                    </a>
                </p>
            </section>
        </main>
        <th:block th:replace="~{fragments/resources :: scripts}">
        </th:block>
    </body>
</html>
