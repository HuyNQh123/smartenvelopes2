<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Tạo kỳ ngân sách', 'budgets', ~{::#main-content}, ~{}, ~{})}">
<body>
<div id="main-content">
    <h2 class="fw-bold mb-3">Tạo kỳ ngân sách</h2>

    <p class="text-muted">
        Chọn tháng và năm để bắt đầu lập kế hoạch chi tiêu cho quỹ hiện tại.
    </p>

    <div class="card shadow-sm border-0 p-4">
        <form th:action="@{/budgets}"
              th:object="${budgetPeriodRequest}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}"
                   class="mb-0"></p>
            </div>

            <div class="mb-3">
                <label for="month" class="form-label">Tháng</label>
                <input type="number"
                       th:field="*{month}"
                       class="form-control"
                       min="1"
                       max="12"
                       required>

                <div th:errors="*{month}"
                     class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
                <label for="year" class="form-label">Năm</label>
                <input type="number"
                       th:field="*{year}"
                       class="form-control"
                       min="1900"
                       max="9999"
                       required>

                <div th:errors="*{year}"
                     class="text-danger small mt-1"></div>
            </div>

            <p class="text-muted">
                Kỳ mới được lưu ở trạng thái nháp.
                Thao tác này không thay đổi số dư tài khoản tiền.
            </p>

            <button type="submit" class="btn btn-primary">
                Tạo kỳ nháp
            </button>

            <a th:href="@{/budgets}"
               class="btn btn-outline-secondary">
                Hủy
            </a>
        </form>
    </div>
</div>
</body>
</html>
