<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/resources :: head('Tạo kỳ ngân sách')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('budgets')}"></div>
    <main class="flex-grow-1 p-4">
        <h2>Tạo kỳ ngân sách</h2>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <form th:action="@{/budgets}" th:object="${budgetRequest}" method="post" class="card shadow-sm border-0 p-4 mt-3" style="max-width: 640px">
            <div class="mb-3">
                <label for="name" class="form-label">Tên kỳ</label>
                <input id="name" th:field="*{name}" class="form-control" maxlength="100" required>
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="month" class="form-label">Tháng</label>
                    <input id="month" type="number" min="1" max="12" th:field="*{month}" class="form-control" required>
                    <div class="text-danger small" th:errors="*{month}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="year" class="form-label">Năm</label>
                    <input id="year" type="number" min="2000" th:field="*{year}" class="form-control" required>
                    <div class="text-danger small" th:errors="*{year}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label for="totalIncome" class="form-label">Thu nhập dự kiến (₫)</label>
                <input id="totalIncome" type="number" min="0" step="1" th:field="*{totalIncome}" class="form-control" required>
                <div class="text-danger small" th:errors="*{totalIncome}"></div>
            </div>
            <div class="mb-3">
                <label for="rolloverPolicy" class="form-label">Xử lý tiền dư cuối kỳ</label>
                <select id="rolloverPolicy" th:field="*{rolloverPolicy}" class="form-select">
                    <option value="SWEEP_TO_PIGGY">Chuyển vào heo đất</option>
                    <option value="CARRY_FORWARD">Chuyển sang kỳ sau</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Lưu kỳ ngân sách</button>
                <a th:href="@{/budgets}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/resources :: scripts}"></th:block>
</body>
</html>
