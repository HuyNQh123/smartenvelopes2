<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, activeMenu, content, extraHead, extraScripts)">
<!-- ===================================================================
     SMARTENVELOPE - MASTER LAYOUT CHUNG CHO TOÀN BỘ 5 THÀNH VIÊN
     Cung cấp: Header, Sidebar, Main Content, Footer, Quản lý CSS & JS riêng
     Phụ trách bởi: Thành viên 1 (Nhóm trưởng / Nền tảng)
     =================================================================== -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - SmartEnvelope' : 'SmartEnvelope'}">SmartEnvelope</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS dùng chung của hệ thống -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Vị trí để các trang con có thể khai báo thêm CSS riêng nếu cần -->
    <th:block th:if="${extraHead != null}">
        <th:block th:replace="${extraHead}" />
    </th:block>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header và sidebar được ghép một lần qua fragment dùng chung. -->
    <div class="app-body">
        <th:block th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></th:block>
        <main id="app-main" class="main-content" tabindex="-1">
                <!-- Thông báo Flash (Success / Error) tự động hiển thị nếu có -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5 align-middle"></i>
                    <span class="align-middle fw-medium" th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 align-middle"></i>
                    <span class="align-middle fw-medium" th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
                </div>

                <!-- NỘI DUNG RIÊNG CỦA TỪNG TRANG ĐƯỢC ĐƯA VÀO ĐÂY -->
                <th:block th:if="${content != null}">
                    <th:block th:replace="${content}" />
                </th:block>
        </main>
    </div>

    <!-- 3. FOOTER CHÂN TRANG DÙNG CHUNG -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript dùng chung của hệ thống -->
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/layout.js}"></script>
    <script th:src="@{/js/member1.js}"></script>

    <!-- Vị trí để các trang con có thể khai báo thêm JavaScript riêng nếu cần (ví dụ Chart.js) -->
    <th:block th:if="${extraScripts != null}">
        <th:block th:replace="${extraScripts}" />
    </th:block>
</body>
</html>
