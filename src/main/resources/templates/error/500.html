<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/resources :: head('Không thể hoàn tất yêu cầu')}">
    </head>
    <body class="error-page">
        <main class="error-container">
            <a th:href="@{/login}" class="auth-brand">
                SmartEnvelope
            </a>
            <p class="error-code">
                500
            </p>
            <h1>
                Không thể hoàn tất yêu cầu
            </h1>
            <p class="text-muted">
                Hệ thống đang gặp sự cố. Vui lòng thử lại sau.
            </p>
            <div class="page-actions">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    Về tổng quan
                </a>
                <a th:href="@{/login}" class="btn btn-outline-secondary">
                    Đăng nhập
                </a>
            </div>
        </main>
    </body>
</html>
