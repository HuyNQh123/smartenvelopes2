<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Giao diện Lỗi 500 - Lỗi máy chủ nội bộ (Dùng chung toàn nhóm) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Sự cố máy chủ - SmartEnvelope</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center py-5 min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h3 class="mb-3">Đã xảy ra sự cố máy chủ</h3>
            <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Hệ thống đang gặp sự cố nội bộ. Vui lòng thử lại sau.'"></p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Trở về Bảng điều khiển
                </a>
                <a th:href="@{/login}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đến trang Đăng nhập
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
