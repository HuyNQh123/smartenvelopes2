<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Giao diện Lỗi 404 - Không tìm thấy trang (Dùng chung toàn nhóm) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang - SmartEnvelope</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center py-5 min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold text-warning">404</h1>
            <h3 class="mb-3">Không tìm thấy trang yêu cầu</h3>
            <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Đường dẫn bạn đang truy cập không tồn tại hoặc đã được di chuyển.'"></p>
            <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door me-1"></i> Trở về Trang chủ
            </a>
        </div>
    </div>
</div>
</body>
</html>
