<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Thêm phong bì', 'envelopes', ~{::#main-content}, ~{}, ~{})}">
<body>
<div id="main-content">
    <h2 class="fw-bold mb-3">Thêm phong bì</h2>

    <p class="text-muted" th:text="${period.name}"></p>

    <div class="card shadow-sm border-0 p-4">
        <form th:action="@{/envelopes(periodId=${period.id})}"
              th:object="${envelopeRequest}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}"
                   class="mb-0"></p>
            </div>

            <div class="mb-3">
                <label for="categoryId" class="form-label">
                    Danh mục chi tiêu
                </label>

                <select th:field="*{categoryId}"
                        class="form-select" required>
                    <option value="">-- Chọn danh mục --</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">
                    </option>
                </select>

                <div th:errors="*{categoryId}"
                     class="text-danger small mt-1"></div>

                <p th:if="${#lists.isEmpty(categories)}"
                   class="text-danger mt-2">
                    Chưa có danh mục chi tiêu đang hoạt động.
                    Cần bổ sung hoặc kích hoạt danh mục trước.
                </p>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">
                    Tên phong bì
                </label>

                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       maxlength="100"
                       placeholder="Ví dụ: Ăn uống tháng 11"
                       required>

                <div th:errors="*{name}"
                     class="text-danger small mt-1"></div>
            </div>

            <p class="text-muted">
                Phong bì mới có số tiền bằng 0.
                Bạn sẽ chia tiền vào phong bì ở bước phân bổ.
            </p>

            <button type="submit"
                    class="btn btn-primary"
                    th:disabled="${#lists.isEmpty(categories)}">
                Thêm phong bì
            </button>

            <a th:href="@{/envelopes(periodId=${period.id})}"
               class="btn btn-outline-secondary">
                Hủy
            </a>
        </form>
    </div>
</div>
</body>
</html>
