<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Tổng quan', 'dashboard', ~{::#main-content}, ~{}, ~{})}">
    <body>
        <div id="main-content" class="member-page">
            <div class="page-header">
                <div>
                    <h1>
                        Tổng quan
                    </h1>
                    <p class="page-description">
                        Quỹ và không gian làm việc của bạn.
                    </p>
                </div>
                <a th:href="@{/workspaces}" class="btn btn-outline-secondary">
                    Quản lý quỹ
                </a>
            </div>
            <section class="member-section" th:if="${currentWorkspace != null}" aria-labelledby="current-workspace-title">
                <div class="section-heading">
                    <h2 id="current-workspace-title">
                        Quỹ đang sử dụng
                    </h2>
                    <span class="badge status-active">
                        Đang sử dụng
                    </span>
                </div>
                <h3 class="workspace-title" th:text="${currentWorkspace.name}">
                    Tên quỹ
                </h3>
                <p class="text-muted" th:if="${currentWorkspace.description != null and !currentWorkspace.description.isEmpty()}" th:text="${currentWorkspace.description}">
                </p>
                <div class="page-actions">
                    <a th:href="@{/workspaces/{id}(id=${currentWorkspace.id})}" class="btn btn-primary">
                        Thông tin và thành viên
                    </a>
                    <a th:href="@{/invitations}" class="btn btn-outline-secondary">
                        Lời mời của tôi
                    </a>
                </div>
            </section>
            <section class="member-section empty-state" th:unless="${currentWorkspace != null}">
                <h2>
                    Chưa chọn quỹ làm việc
                </h2>
                <p>
                    Chọn một quỹ hiện có hoặc tạo quỹ chung để bắt đầu.
                </p>
                <a th:href="@{/workspaces}" class="btn btn-primary">
                    Xem quỹ của bạn
                </a>
            </section>
        </div>
    </body>
</html>
