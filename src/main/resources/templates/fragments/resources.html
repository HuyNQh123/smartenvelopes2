<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Tài nguyên chung cho trang giữ bố cục riêng, không thay thế bằng thanh điều hướng. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title + ' - SmartEnvelope'}">SmartEnvelope</title>
    <!-- Bootstrap phải đứng trước Design System; không nạp riêng các CSS con. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/layout.js}"></script>
    <script th:src="@{/js/member1.js}"></script>
</th:block>
</html>
