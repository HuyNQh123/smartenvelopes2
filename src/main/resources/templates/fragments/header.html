<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- ===================================================================
     Fragment Header: Thanh điều hướng phía trên (Thành viên 1 phụ trách)
     Gồm: Logo SmartEnvelope, Bộ chuyển đổi Quỹ, Thông tin User và Nút Logout
     =================================================================== -->
<header th:fragment="header" class="navbar navbar-expand-md navbar-custom sticky-top">
    <div class="container-fluid px-3 px-md-4">
        
        <!-- 1. Bên trái: Nút Menu di động + Logo SmartEnvelope -->
        <div class="d-flex align-items-center">
            <!-- Nút bật Sidebar trên màn hình điện thoại/tablet -->
            <button class="navbar-toggler border-0 me-2 d-md-none" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#sidebarMenu" 
                    aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-3 text-dark"></i>
            </button>

            <!-- Logo thương hiệu -->
            <a th:href="@{/dashboard}" class="brand-logo me-4">
                <span class="brand-icon">
                    <i class="bi bi-envelope-paper-heart-fill"></i>
                </span>
                <span>SmartEnvelope</span>
            </a>
        </div>

        <!-- 2. Ở giữa: Bộ chọn Không gian làm việc / Quỹ tài chính (Workspace Context) -->
        <div class="d-none d-sm-block me-auto" th:if="${currentWorkspace != null}">
            <div class="dropdown">
                <button class="btn workspace-badge d-flex align-items-center" type="button" 
                        data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-wallet2 text-primary me-2"></i>
                    <span class="fw-semibold text-truncate me-2" style="max-width: 220px;" 
                          th:text="${currentWorkspace.name}">Quỹ cá nhân</span>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle me-2" 
                          style="font-size: 0.7rem;" 
                          th:text="${currentWorkspace.type != null ? currentWorkspace.type : 'PERSONAL'}">PERSONAL</span>
                    <i class="bi bi-chevron-down text-muted small"></i>
                </button>
                <ul class="dropdown-menu shadow border-0 mt-2 p-2" style="min-width: 280px;">
                    <li class="dropdown-header text-uppercase text-muted small py-1" style="font-size: 0.72rem;">
                        <i class="bi bi-arrow-repeat me-1"></i> Chuyển đổi không gian quỹ
                    </li>
                    <li th:each="ws : ${availableWorkspaces}">
                        <form th:action="@{/workspace/switch}" method="post" class="m-0 p-0">
                            <input type="hidden" name="workspaceId" th:value="${ws.id}" />
                            <button type="submit" 
                                    class="dropdown-item rounded d-flex justify-content-between align-items-center py-2 px-3 my-1"
                                    th:classappend="${currentWorkspace != null and ws.id == currentWorkspace.id} ? 'active bg-primary text-white' : ''">
                                <div class="text-truncate me-2">
                                    <div class="fw-semibold text-truncate" th:text="${ws.name}">Tên Quỹ</div>
                                    <small th:class="${currentWorkspace != null and ws.id == currentWorkspace.id} ? 'text-white-50' : 'text-muted'" 
                                           th:text="${ws.type != null ? ws.type : 'PERSONAL'}">PERSONAL</small>
                                </div>
                                <i th:if="${currentWorkspace != null and ws.id == currentWorkspace.id}" class="bi bi-check2-circle fs-5"></i>
                            </button>
                        </form>
                    </li>
                    <li><hr class="dropdown-divider my-2"></li>
                    <li>
                        <a th:href="@{/workspaces}" class="dropdown-item rounded small text-primary py-2 px-3">
                            <i class="bi bi-gear me-2"></i>Quản lý danh sách Quỹ...
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 3. Bên phải: Thông tin người dùng & Nút Đăng xuất -->
        <div class="d-flex align-items-center">
            
            <!-- Dropdown người dùng -->
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-decoration-none text-dark dropdown-toggle" 
                   data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="user-avatar-circle me-2">
                        <span th:text="${currentUser != null and currentUser.fullName != null and !currentUser.fullName.isEmpty() ? #strings.substring(currentUser.fullName, 0, 1) : 'U'}">U</span>
                    </div>
                    <div class="d-none d-lg-block text-start me-1">
                        <div class="fw-semibold text-truncate" style="max-width: 150px; font-size: 0.88rem;" 
                             th:text="${currentUser != null ? currentUser.fullName : 'Tài khoản'}">Nguyễn Văn A</div>
                        <div class="text-muted" style="font-size: 0.72rem;" 
                             th:text="${currentUser != null ? currentUser.email : 'user@example.com'}">user@example.com</div>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-2" style="min-width: 220px;">
                    <li class="px-3 py-2 border-bottom mb-2">
                        <div class="fw-bold" th:text="${currentUser != null ? currentUser.fullName : 'Người dùng'}">Người dùng</div>
                        <div class="small text-muted text-truncate" th:text="${currentUser != null ? currentUser.email : ''}">email@domain.com</div>
                        <span class="badge bg-secondary-subtle text-secondary mt-1" 
                              th:text="${currentUser != null and currentUser.role != null ? 'Vai trò: ' + currentUser.role : 'USER'}">USER</span>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin/users}" class="dropdown-item py-2 rounded text-warning">
                            <i class="bi bi-shield-lock me-2"></i>Quản trị hệ thống
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/dashboard}" class="dropdown-item py-2 rounded">
                            <i class="bi bi-person me-2"></i>Bảng điều khiển
                        </a>
                    </li>
                    <li><hr class="dropdown-divider my-2"></li>
                    <li>
                        <!-- Nút Đăng xuất chuẩn bảo mật Spring Security với form POST và CSRF token -->
                        <form th:action="@{/logout}" method="post" class="m-0 p-0">
                            <button type="submit" class="dropdown-item py-2 rounded text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
            
        </div>
    </div>
</header>
</html>
