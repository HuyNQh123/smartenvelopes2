<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/resources :: head('Tạo mục tiêu tiết kiệm')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('savings')}"></div>
    <main class="flex-grow-1 p-4">
        <h2>Tạo mục tiêu tiết kiệm</h2>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <form th:action="@{/savings}" th:object="${savingsGoalRequest}" method="post" class="card border-0 shadow-sm p-4 mt-3" style="max-width: 640px">
            <div class="mb-3">
                <label for="name" class="form-label">Tên mục tiêu</label>
                <input id="name" th:field="*{name}" class="form-control" maxlength="100" required>
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label for="targetAmount" class="form-label">Số tiền mục tiêu (₫)</label>
                <input id="targetAmount" type="number" min="1" step="1" th:field="*{targetAmount}" class="form-control" required>
                <div class="text-danger small" th:errors="*{targetAmount}"></div>
            </div>
            <div class="mb-3">
                <label for="initialAmount" class="form-label">Số tiền gửi ban đầu (₫)</label>
                <input id="initialAmount" type="number" min="0" step="1" th:field="*{initialAmount}" class="form-control">
                <div class="text-danger small" th:errors="*{initialAmount}"></div>
                <div class="form-text">Khoản gửi ban đầu sẽ được ghi vào heo đất.</div>
            </div>
            <div class="mb-3">
                <label for="targetDate" class="form-label">Hạn dự kiến</label>
                <input id="targetDate" type="date" th:field="*{targetDate}" class="form-control">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Lưu mục tiêu</button>
                <a th:href="@{/savings}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/resources :: scripts}"></th:block>
</body>
</html>
