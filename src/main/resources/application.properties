# ========================================================
# SMARTENVELOPE - APPLICATION CONFIGURATION
# ========================================================

# Tên ứng dụng
spring.application.name=SmartEnvelope

# Cổng máy chủ web (mặc định 8080, có thể ghi đè qua biến môi trường PORT)
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always

# --------------------------------------------------------
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL
# Sử dụng biến môi trường DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_envelope}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# --------------------------------------------------------
# validate: kiểm tra cấu hình Entity khớp với schema do Flyway tạo
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# --------------------------------------------------------
# CẤU HÌNH FLYWAY DATABASE MIGRATION
# --------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------------
# CẤU HÌNH THYMELEAF TEMPLATE ENGINE
# --------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Tắt cache trong môi trường phát triển để tự động tải lại giao diện khi sửa file html
spring.thymeleaf.cache=false

# --------------------------------------------------------
# LOGGING
# --------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartenvelope=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
